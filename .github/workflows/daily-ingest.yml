name: Daily ingest + analyze

on:
  schedule:
    # 04:00 UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Order matters. Each step is independent so we use `if: always()` to keep going.
      - name: Pull metrics + refresh baseline
        run: npm run ingest
      - name: Tag new posts (hook + retention)
        if: ${{ always() }}
        run: npm run analyze
      - name: Posting monitor
        if: ${{ always() }}
        run: npm run monitor
      - name: Health check (freshness + cost + parser failures)
        if: ${{ always() }}
        run: npm run health-check
