name: Weekly reviews

on:
  schedule:
    # Tuesday 14:00 UTC — gives Sunday/Monday posts >24h to accumulate metrics
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      creator_id:
        description: 'Single creator UUID (optional; runs all if omitted)'
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Generate reviews
        run: |
          if [ -n "${{ inputs.creator_id }}" ]; then
            npm run review -- "${{ inputs.creator_id }}"
          else
            npm run review:all
          fi
